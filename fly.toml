# fly.toml app configuration file generated for imageconv-api on 2026-08-06T15:57:06+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'imageconv-api'
primary_region = 'bom'

[build]
[env]
  PORT = '8080'

[[mounts]]
  source = 'imageconv_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
